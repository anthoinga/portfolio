<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#f3f1ec" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" sizes="any" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<!-- Sets the theme before first paint so there is no light/dark flash. -->
		<script>
			;(function () {
				try {
					var t = localStorage.getItem('theme')
					if (t !== 'light' && t !== 'dark') {
						t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
					}
					document.documentElement.dataset.theme = t
					var m = document.querySelector('meta[name="theme-color"]')
					if (m) m.setAttribute('content', t === 'dark' ? '#0e1010' : '#f3f1ec')
				} catch (e) {
					document.documentElement.dataset.theme = 'light'
				}
			})()
		</script>
		<!-- Show the intro shell before first paint for visitors who have not seen it this session. -->
		<script>
			;(function () {
				try {
					var skip =
						sessionStorage.getItem('intro') === 'done' ||
						matchMedia('(prefers-reduced-motion: reduce)').matches ||
						/bot|crawl|spider|lighthouse|headless/i.test(navigator.userAgent)
					if (!skip) document.documentElement.classList.add('intro-pending')
				} catch (e) {}
			})()
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
