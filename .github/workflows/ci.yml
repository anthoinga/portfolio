name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PUBLIC_SITE_URL: https://inga.dev
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Verify the agent-readable surface
        run: |
          pnpm --filter web exec vite preview --port 4173 --host 127.0.0.1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node apps/web/scripts/verify-agentic.mjs http://127.0.0.1:4173 --direct
